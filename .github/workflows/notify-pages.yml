# Asks blpatnaik31.github.io to re-sync this portfolio as soon as site files
# change on main. Optional: without the PAGES_SYNC_TOKEN secret it does nothing
# and the Pages repo still picks up changes on its hourly sync.
#
# To enable: create a fine-grained token with access to blpatnaik31.github.io
# and "Contents: Read and write" permission, then add it to this repo as the
# Actions secret PAGES_SYNC_TOKEN (Settings -> Secrets and variables -> Actions).
name: Notify Pages site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in blpatnaik31.github.io
        env:
          TOKEN: ${{ secrets.PAGES_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PAGES_SYNC_TOKEN is not set; the hourly sync will publish this change."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/blpatnaik31/blpatnaik31.github.io/dispatches \
            -d '{"event_type":"portfolio-updated"}'
